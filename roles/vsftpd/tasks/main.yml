---
- name: Instalar vsftpd
  community.general.zypper:
    name: vsftpd
    state: present

- name: Desplegar la plantilla vsftpd.conf
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reiniciar vsftpd

- name: Iniciar y habilitar vsftpd
  ansible.builtin.systemd:
    name: vsftpd
    state: started
    enabled: true

- name: Abrir FTP en el firewall
  ansible.posix.firewalld:
    service: ftp
    permanent: true
    immediate: true
    state: enabled

- name: Abrir los puertos pasivos de FTP en el firewall
  ansible.posix.firewalld:
    port: "{{ vsftpd_pasv_min_port }}-{{ vsftpd_pasv_max_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
