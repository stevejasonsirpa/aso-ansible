---
- name: Instalar Apache
  community.general.zypper:
    name: apache2
    state: present

- name: Iniciar y habilitar Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true

- name: Abrir HTTP en el firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
