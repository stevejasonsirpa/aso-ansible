---
- name: Instalar MariaDB y el conector de Python
  community.general.zypper:
    name:
      - mariadb
      - mariadb-client
      - python313-PyMySQL
    state: present

- name: Iniciar y habilitar MariaDB
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Asignar la contrasena de root en MariaDB
  block:
    - name: Asignar la contrasena de root en MariaDB
      community.mysql.mysql_user:
        column_case_sensitive: true
        name: root
        host: localhost
        password: "{{ mariadb_root_password }}"
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: "{{ mariadb_socket }}"
        check_implicit_admin: true
      no_log: true
  rescue:
    - name: Explicar por que no se pudo entrar a MariaDB
      ansible.builtin.fail:
        msg: >-
          No se pudo entrar a MariaDB como root ni sin contrasena ni con la del vault.
          Este servidor ya tenia MariaDB con otra contrasena de root (no es una maquina vacia).
          Soluciones: usar una maquina vacia, poner esa contrasena en vault_mariadb_root_password,
          o borrar MariaDB en el destino con: zypper -n remove mariadb && rm -rf /var/lib/mysql

- name: Eliminar usuarios anonimos
  community.mysql.mysql_user:
    column_case_sensitive: true
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"

- name: Eliminar la base de prueba
  community.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear la base de datos de la aplicacion
  community.mysql.mysql_db:
    name: "{{ mariadb_app_db }}"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el usuario de la aplicacion con permisos sobre su base
  community.mysql.mysql_user:
    column_case_sensitive: true
    name: "{{ mariadb_app_user }}"
    host: localhost
    password: "{{ mariadb_app_password }}"
    priv: "{{ mariadb_app_db }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
  no_log: true
